<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/standart.css">
    <link rel="stylesheet" href="./styles/fonts.css">
</head>

<body onload="init()">
    <navbar class="navbar">
        <nav>
            <ul>
                <li>
                    <a href="index.html">
                        <img src="./assets/icons/Logo-02.png" alt="BestellApp-logo">
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="./assets/icons/menu-bar.png" alt="menu-bar">
                    </a>
                </li>
            </ul>
        </nav>
    </navbar>
    <section class="hero-section">
        <img class="hero-img" src="./assets/img/hero.png" alt="hero-img">
        <img class="hero-hamburger-logo" src="./assets/img/hero-logo-hamburger.png" alt="hero-hamburger-img">
        <div class="hero-text-1">
            <h1 class="hero-title"><b style="color: var(--navbar);">Burger</b><b style="color: var(--hero1);"">House</b></h1>
            <div class=" div-rating">
                    <img src="./assets/icons/star.png">
                    <p class="text-bald">4,1</p>
                    <p class="text-normal" style="color: var(--);">(317)</p>
        </div>
        </div>
        <div class="hero-text-2">
            <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
        </div>
    </section>
    <main>

        <!-- Burgers section-->
        <section class="divider">
            <div class="divider-color">
            </div>
            <div class="divider-info">
                <img class="divider-img" src="./assets/img/burger-menu.png">
                <h2 class="divider-header">Burger & Sandwiches</h2>
            </div>
        </section>

        <div class="container">
            <section id="burger-meals" class="meals-div">

            </section>
            <aside class="basket">
                <h3>Your Basket</h3>
                <div class="basket-empty" id="basket-empty">
                    <p>
                        Nothing here yet.<br>
                        Go ahead and choose something
                        delicious!
                    </p>
                    <div class="basket-icon">
                        <img src="./assets/icons/basket-big.png">
                    </div>
                </div>
                <div class="basket-full" id="basket-full">
                    <div id="basket-items" class="basket-items">

                    </div>
                    <div id="payment-div" class="payment-div">
                        <div class="subtotal-div">
                            <p>Subtotal</p>
                            <p id="subtotal">€</p>
                        </div>
                        <div class="delivery-fee-div">
                            <p>Delivery fee</p>
                            <p id="subtotal">4,99€</p>
                        </div>
                        <hr>
                        <div class="total-div">
                            <p>Total</p>
                            <p id="total">€</p>
                        </div>
                        <button class="buy-now-price" id="buy-now-price">
                            Buy now (Price)
                        </button>
                    </div>
                </div>
            </aside>

        </div>

        <!-- Pizzas section-->

        <section class="divider">
            <div class="divider-color">
            </div>
            <div class="divider-info">
                <img class="divider-img" src="./assets/img/pizza-menu.png">
                <h2 class="divider-header">Pizzas</h2>
            </div>
        </section>

        <div class="container">
            <section id="pizza-meals" class="meals-div">

            </section>
        </div>

        <!-- Salads section-->

        <section class="divider">
            <div class="divider-color">
            </div>
            <div class="divider-info">
                <img class="divider-img" src="./assets/img/salad-menu.png">
                <h2 class="divider-header">Salads</h2>
            </div>
        </section>

        <div class="container">
            <section id="salad-meals" class="meals-div">

            </section>
        </div>

    </main>
    <footer>
        <span><img src="./assets/icons/copyright.png" alt="copyright">2026 BurgerHouse</span>
        <a href="#">Imprint</a>
        <a href="#">Cookie Preferences</a>
    </footer>

    <script src="./scripts/db.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/template.js"></script>
</body>

</html>
